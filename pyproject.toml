[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dossier"
version = "0.1.0"
description = "An OpenMinion agent that compiles an evidence dossier of AI-enabled phishing and social-engineering lures."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yusuf Ojo Raifu" }]
dependencies = [
  "openminion==0.1.22",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dossier = "dossier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
